name: WP probe (diagnostica anti-bot, temporaneo)

# Diagnostica sola lettura: da N runner GitHub (IP diversi) fa una GET pubblica
# alle API WordPress e registra se SiteGround risponde col captcha. Nessuna
# scrittura su WP, nessun segreto. Da rimuovere a fine indagine.
on:
  push:
    branches:
      - claude/blissful-euler-jx1tks
    paths:
      - ".github/workflows/wp-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    steps:
      - name: Probe
        run: |
          IP=$(curl -s --max-time 10 https://api.ipify.org || echo "?")
          for u in "https://nove-c.com/robots.txt" "https://nove-c.com/wp-json/wp/v2/posts?categories=3&per_page=1&_fields=id"; do
            CODE=$(curl -s -o body.txt -w "%{http_code}" --max-time 20 "$u")
            if grep -q sgcaptcha body.txt; then R="CAPTCHA"; else R="ok"; fi
            echo "runner=$IP code=$CODE esito=$R url=$u"
          done
